<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MidPoint Meet – Join Session</title>
  <meta name="description" content="You've been invited to find a midpoint meeting place." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #3F51B5 0%, #1a237e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 26px; font-weight: 700; color: #1a237e; margin-bottom: 8px; }
    .subtitle { font-size: 16px; color: #555; margin-bottom: 32px; line-height: 1.5; }
    .btn {
      display: block;
      background: #3F51B5;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 18px 32px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 16px;
      transition: background 0.2s;
    }
    .btn:hover { background: #303f9f; }
    .error { color: #c62828; font-size: 15px; margin-top: 16px; }
    .note { font-size: 13px; color: #888; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📍</div>
    <h1>MidPoint Meet</h1>
    <p class="subtitle" id="subtitle">You've been invited to find a midpoint meeting place. Tap below to open the app.</p>
    <a class="btn" id="openBtn" href="#">Open MidPoint Meet</a>
    <p class="note">Make sure MidPoint Meet is installed on your device.</p>
    <p class="error" id="errorMsg"></p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get('sessionId');
      var token = params.get('token');
      var btn = document.getElementById('openBtn');
      var errorMsg = document.getElementById('errorMsg');

      if (!sessionId || !token) {
        btn.style.display = 'none';
        errorMsg.textContent = 'Invalid invite link — missing session ID or token. Please ask the sender to share the link again.';
        return;
      }

      var deepLink = 'midpointmeet://session?sessionId=' + encodeURIComponent(sessionId) + '&token=' + encodeURIComponent(token) + '&isSender=false';
      btn.href = deepLink;

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = deepLink;
        // Fallback: if app not installed after 2s, show store link
        setTimeout(function () {
          document.getElementById('subtitle').textContent = "Couldn't open the app. Make sure MidPoint Meet is installed.";
        }, 2000);
      });
    })();
  </script>
</body>
</html>
